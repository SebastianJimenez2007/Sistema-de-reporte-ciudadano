<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Entidad - ReportApp</title>
</head>
<body>
  <main>
    <div class="entidad-panel">
      <div class="panel-header">
        <h1><i class="bi bi-building"></i> Panel de Entidad</h1>
        <p>Gestión de reportes de tu institución</p>
      </div>

      <div class="stats-entidad">
        <div class="stat-card">
          <div class="stat-number" id="entidad-asignados">0</div>
          <div class="stat-label">Asignados</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="entidad-proceso">0</div>
          <div class="stat-label">En Proceso</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="entidad-resueltos">0</div>
          <div class="stat-label">Resueltos</div>
        </div>
      </div>

      <div class="reportes-entidad" id="reportes-entidad"></div>
    </div>
  </main>
</body>
</html>
